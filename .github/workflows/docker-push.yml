name: docker-push

on:
  push:
    branches: main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        version: [17, 18]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Docker version info
        run: |
          docker --version

          docker compose --version

      - name: Build & push kiwitcms/postgres:${{ matrix.version }}
        working-directory: ${{ matrix.version }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")

          docker build --sbom=true --provenance=mode=max -t kiwitcms/postgres:${{ matrix.version }} .
          docker tag kiwitcms/postgres:${{ matrix.version }} kiwitcms/postgres:${{ matrix.version }}-$TIMESTAMP

          docker images

          echo "${{ secrets.DOCKER_PUSH_TOKEN }}" | docker login -u="${{ secrets.DOCKER_PUSH_USERNAME }}" --password-stdin
          docker push kiwitcms/postgres:${{ matrix.version }}-$TIMESTAMP
          docker push kiwitcms/postgres:${{ matrix.version }}
          docker logout

      - name: Remove container registry credentials
        if: always()
        run: |
          docker logout || true
          rm -f ~/.docker/config.json
